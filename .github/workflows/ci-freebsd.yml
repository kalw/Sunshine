---
name: CI-FreeBSD
permissions: {}

on:
  workflow_call:
    inputs:
      release_commit:
        required: true
        type: string
      release_version:
        required: true
        type: string

env:
  BRANCH: ${{ github.head_ref || github.ref_name }}
  BUILD_VERSION: ${{ inputs.release_version }}
  PYTHON_VERSION: '3.14'
  COMMIT: ${{ inputs.release_commit }}
  FREEBSD_CLANG_VERSION: 19

jobs:
  build_freebsd:
    name: ${{ matrix.cmake_processor }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - bsd_release: '15.1'
            arch: x86_64
            cmake_processor: amd64
            runner: ubuntu-latest
            build_ffmpeg_from_source: false
          # EXPERIMENTAL: aarch64 was dropped from LizardByte/build-deps'
          # prebuilt FFmpeg releases (build-deps#757) for being too slow
          # under nested QEMU virtualization. This entry builds FFmpeg (and
          # x264/x265/SvtAv1Enc) from source directly in this job instead of
          # relying on a build-deps prebuilt archive, to get a real timing
          # measurement of whether aarch64 is viable at all in this exact CI
          # environment. See the "Build FFmpeg from source" step below.
          - bsd_release: '15.1'
            arch: aarch64
            cmake_processor: arm64
            runner: ubuntu-latest
            build_ffmpeg_from_source: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Get Processor Count
        id: processor_count
        shell: bash
        run: |
          PROCESSOR_COUNT=$(nproc)
          echo "PROCESSOR_COUNT=${PROCESSOR_COUNT}" >> "${GITHUB_OUTPUT}"
          echo "PROCESSOR_COUNT: $PROCESSOR_COUNT"

      - name: Setup FreeBSD
        uses: vmactions/freebsd-vm@4469451fe39bee80be4066836c5170362e9349f3  # v1.5.7
        with:
          arch: ${{ matrix.arch }}
          cpu: ${{ steps.processor_count.outputs.PROCESSOR_COUNT }}
          envs: 'BRANCH BUILD_VERSION COMMIT PYTHON_VERSION'
          # TODO: there is no libcap for freebsd... we need graphics/libdrm if we find a way to use libcap
          prepare: |
            set -e

            pkg update
            pkg upgrade -y
            pkg install -y \
              audio/opus \
              audio/pulseaudio \
              devel/boost-all \
              devel/cmake-core \
              devel/doxygen \
              devel/evdev-proto \
              devel/git \
              devel/libevdev \
              devel/llvm${{ env.FREEBSD_CLANG_VERSION }} \
              devel/ninja \
              devel/pkgconf \
              devel/uv \
              devel/qt6-base \
              ftp/curl \
              graphics/graphviz \
              graphics/libdrm \
              graphics/qt6-svg \
              graphics/shaderc \
              graphics/vulkan-headers \
              graphics/vulkan-loader \
              graphics/wayland \
              lang/python314 \
              multimedia/libva \
              multimedia/pipewire \
              net/miniupnpc \
              ports-mgmt/pkg \
              security/openssl \
              shells/bash \
              www/npm-node22 \
              x11/libX11 \
              x11/libxcb \
              x11/libXfixes \
              x11/libXrandr \
              x11/libXtst \
              x11-servers/xorg-server

            if [ "${{ matrix.build_ffmpeg_from_source }}" = "true" ]; then
              # extra build tooling only needed to compile LizardByte/build-deps
              # (FFmpeg + x264/x265/SvtAv1Enc) from source ourselves, since no
              # prebuilt FreeBSD/aarch64 archive is currently published
              pkg install -y \
                devel/autoconf \
                devel/automake \
                devel/gmake \
                devel/libtool \
                devel/nasm
            fi

            # create symlink for shebang bash compatibility
            ln -s /usr/local/bin/bash /bin/bash

            # setup python
            ln -s /usr/local/bin/python3.14 /usr/local/bin/python
          release: ${{ matrix.bsd_release }}
          run: |
            set -e
            # Keep FreeBSD off Sunshine's default dependency path: lizardbyte-common[c]
            # includes clang-format, which has no FreeBSD wheel and is slow to build.
            set -- \
              --locked \
              --only-group glad \
              --python "/usr/local/bin/python${PYTHON_VERSION}" \
              --no-python-downloads \
              --no-install-project
            # uv.lock pins external artifacts; the reviewed vendored glad2 build hook is required.
            uv sync "$@"  # NOSONAR(githubactions:S8541, githubactions:S8544)
            set -- \
              --project third-party/lizardbyte-common \
              --locked \
              --only-group test-c \
              --python "/usr/local/bin/python${PYTHON_VERSION}" \
              --no-python-downloads \
              --no-install-project
            # uv.lock pins the source artifact; FreeBSD must build lxml because no wheel is available.
            uv sync "$@"  # NOSONAR(githubactions:S8541, githubactions:S8544)

            # fix git safe.directory issues
            git config --global --add safe.directory "*"
          sync: nfs  # sshfs is used for build-deps; however it's much slower than nfs

      # EXPERIMENTAL (see matrix comment above): LizardByte/build-deps no
      # longer publishes a prebuilt FreeBSD/aarch64 FFmpeg archive
      # (build-deps#757, dropped for being slow under nested QEMU
      # virtualization on GH-hosted runners). This step builds it from
      # source instead, as a real timing measurement of whether that's
      # actually true end-to-end in this exact CI environment, using the
      # same build-deps CMake project upstream's own release process uses.
      - name: Build FFmpeg from source (aarch64 experiment)
        if: matrix.build_ffmpeg_from_source
        shell: freebsd {0}
        run: |
          set -e

          cc_path="$(which clang${{ env.FREEBSD_CLANG_VERSION }})"
          cxx_path="$(which clang++${{ env.FREEBSD_CLANG_VERSION }})"

          build_deps_dir="${GITHUB_WORKSPACE}/../build-deps"
          build_deps_dist="${GITHUB_WORKSPACE}/../build-deps-dist"

          git clone --recurse-submodules --depth 1 \
            https://github.com/LizardByte/build-deps.git "${build_deps_dir}"

          # some build-deps scripts assume Linux's /bin/bash
          for f in $(grep -rl '^#!/bin/bash$' "${build_deps_dir}" 2>/dev/null); do
            sed -i '' "1s|^#!/bin/bash\$|#!/usr/local/bin/bash|" "$f"
          done

          cmake \
            -B "${build_deps_dir}/build" \
            -S "${build_deps_dir}" \
            -G "Unix Makefiles" \
            -DCMAKE_C_COMPILER="${cc_path}" \
            -DCMAKE_CXX_COMPILER="${cxx_path}" \
            -DCMAKE_MAKE_PROGRAM=gmake \
            -DCMAKE_INSTALL_PREFIX="${build_deps_dist}"
          gmake -C "${build_deps_dir}/build"
          gmake -C "${build_deps_dir}/build" install

          echo "FFMPEG_PREPARED_BINARIES=${build_deps_dist}/ffmpeg" >> "${GITHUB_ENV}"

      - name: Configure
        shell: freebsd {0}
        run: |
          set -e
          cd "${GITHUB_WORKSPACE}"

          cc_path="$(which clang${{ env.FREEBSD_CLANG_VERSION }})"
          cxx_path="$(which clang++${{ env.FREEBSD_CLANG_VERSION }})"

          export CC="${cc_path}"
          export CXX="${cxx_path}"

          cmake_extra_args=""
          if [ -n "${FFMPEG_PREPARED_BINARIES:-}" ]; then
            cmake_extra_args="-DFFMPEG_PREPARED_BINARIES=${FFMPEG_PREPARED_BINARIES}"
          fi

          mkdir -p build
          cmake \
            -B build \
            ${cmake_extra_args} \
            -G Ninja \
            -S . \
            -DBUILD_DOCS=ON \
            -DBUILD_WERROR=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DGLAD_SKIP_PIP_INSTALL=ON \
            -DPython_EXECUTABLE="${GITHUB_WORKSPACE}/.venv/bin/python" \
            -DSUNSHINE_ASSETS_DIR=share/assets \
            -DSUNSHINE_EXECUTABLE_PATH=/usr/local/bin/sunshine \
            -DSUNSHINE_ENABLE_CUDA=OFF \
            -DSUNSHINE_ENABLE_DRM=OFF \
            -DSUNSHINE_ENABLE_KWIN=ON \
            -DSUNSHINE_ENABLE_PORTAL=ON \
            -DSUNSHINE_ENABLE_WAYLAND=ON \
            -DSUNSHINE_ENABLE_X11=ON \
            -DSUNSHINE_PUBLISHER_NAME="${GITHUB_REPOSITORY_OWNER}" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://app.lizardbyte.dev" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://app.lizardbyte.dev/support"

      - name: Build
        shell: freebsd {0}
        run: |
          set -e
          cd "${GITHUB_WORKSPACE}"
          ninja -C build

      - name: Package
        shell: freebsd {0}
        run: |
          set -e
          cd "${GITHUB_WORKSPACE}"

          mkdir -p artifacts

          cd build
          cpack -G FREEBSD

          # move compiled files to artifacts
          mv ./cpack_artifacts/Sunshine.pkg \
            ../artifacts/Sunshine-FreeBSD-${{ matrix.bsd_release }}-${{ matrix.cmake_processor }}.pkg

      - name: Debug
        if: always()
        shell: bash
        working-directory: build/cpack_artifacts/_CPack_Packages/FreeBSD/FREEBSD/Sunshine
        run: |
          echo "FreeBSD CPack Debug"
          echo "===== Staging Directory Contents ====="
          ls -la
          echo ""
          echo "===== +MANIFEST Content ====="
          cat +MANIFEST
          echo ""

          # use tar to print the contents of the pkg
          cd "${GITHUB_WORKSPACE}/artifacts"
          echo "===== Package Contents ====="
          tar -tvf Sunshine-FreeBSD-${{ matrix.bsd_release }}-${{ matrix.cmake_processor }}.pkg
          echo ""
          echo "===== Package Statistics ====="
          echo -n "Total files in package: "
          tar -tf Sunshine-FreeBSD-${{ matrix.bsd_release }}-${{ matrix.cmake_processor }}.pkg 2>&1 | wc -l
          echo ""
          echo "Package file size:"
          ls -lh Sunshine-FreeBSD-${{ matrix.bsd_release }}-${{ matrix.cmake_processor }}.pkg

      - name: Test
        id: test
        shell: freebsd {0}
        run: |
          set -e
          cd "${GITHUB_WORKSPACE}/build/tests"

          export DISPLAY=:1
          Xvfb ${DISPLAY} -screen 0 1024x768x24 &
          XVFB_PID=$!

          ./test_sunshine --gtest_color=yes --gtest_output=xml:test_results.xml

          kill ${XVFB_PID}

      - name: Generate gcov report
        id: test_report
        # any except canceled or skipped
        if: >-
          always() &&
          (steps.test.outcome == 'success' || steps.test.outcome == 'failure')
        shell: freebsd {0}
        run: |
          cd "${GITHUB_WORKSPACE}/build"
          uv run --project "${GITHUB_WORKSPACE}/third-party/lizardbyte-common" \
            --locked --only-group test-c --no-sync gcovr . -r ../src \
            --exclude-noncode-lines \
            --exclude-throw-branches \
            --exclude-unreachable-branches \
            --verbose \
            --xml-pretty \
            -o coverage.xml

      - name: Upload coverage artifact
        if: >-
          always() &&
          (steps.test_report.outcome == 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-FreeBSD-${{ matrix.cmake_processor }}
          path: |
            build/coverage.xml
            build/tests/test_results.xml
          if-no-files-found: error

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-FreeBSD-${{ matrix.cmake_processor }}
          path: artifacts/
          if-no-files-found: error
